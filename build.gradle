plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

group = 'uk.co.hexeption'
version = project.findProperty('mod_version') ?: '1.20.1-1.0-fabric.1'

base {
    archivesName = 'RSInfinityBooster'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1'
    modImplementation files('../refinedstorage/build/libs/refinedstorage-1.12.4-fabric.1.jar')
    modLocalRuntime files('../refinedstorageaddons/build/libs/refinedstorageaddons-0.10.0-fabric.1.jar')
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_rsinfinitybooster" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
